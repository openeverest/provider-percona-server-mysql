apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-cluster
spec:
  providerRef:
    name: percona-server-mysql
  components:
    engine:
      type: mysql
      replicas: 3
    proxy:
      type: haproxy
      replicas: 1
    monitoring:
      type: pmm
      parameters:
        monitoringConfigName: test-pmm
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: test-ps-cluster
spec:
  mysql:
    size: 3
  proxy:
    haproxy:
      enabled: true
      size: 1
  pmm:
    enabled: true
    serverHost: pmm.example.invalid
    image: percona/pmm-client:3.8.0
    customClusterName: test-ps-cluster
    imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Secret
metadata:
  name: test-ps-cluster-secrets
type: Opaque
data:
  pmmservertoken: YWJjZGVm
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringConfig
metadata:
  name: test-pmm
spec:
  type: pmm
  pmm:
    url: http://pmm.example.invalid

