apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-percona-server-mysql-ps-operator
  namespace: provider-system
spec:
  replicas: 0
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-storage-credentials
type: Opaque
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: test-storage-s3
spec:
  backupStorageClassRef:
    name: s3
  location:
    objectStore:
      bucket: test-backup-bucket
  parameters:
    region: us-east-1
    endpointURL: http://fake
    forcePathStyle: true
    implementation: other
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: backup-storage-credentials
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
  (backupClasses[?name == 'ps'].compatibility | [0]): Compatible
---
# The class the chart installs, once the provider has accepted it and
# core has judged it compatible with the provider.
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: ps
spec:
  displayName: Percona Backup for Percona Server for MySQL Operator
  executionMode: ProviderManaged
  backupStorageClasses:
    - name: s3
      authModes:
        - AccessKey
  providerManaged:
    providerRef:
      name: percona-server-mysql
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
  (providers[?name == 'percona-server-mysql'].compatibility | [0]): Compatible

