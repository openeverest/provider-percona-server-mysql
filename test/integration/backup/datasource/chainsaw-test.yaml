---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backup-restore
spec:
  description: |
    Restore from a backup onto the same Instance: create a cluster with
    backups enabled, take a backup, create a Restore CR targeting that
    cluster, and verify PerconaServerMySQLRestore is created.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,ps.ps.percona.com,backup,ps-backup.ps.percona.com,restore,ps-restore.ps.percona.com,backupstorage -o yaml
    - script:
        content: kubectl get backupclass -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mysql
        tail: 100
    - script:
        content: |
          for kind in ps.ps.percona.com ps-backup.ps.percona.com ps-restore.ps.percona.com restore backup instance; do
            kubectl -n "$NAMESPACE" get "$kind" -o name 2>/dev/null | while read obj; do
              kubectl -n "$NAMESPACE" patch "$obj" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            done
          done
          kubectl -n "$NAMESPACE" patch ps.ps.percona.com --all --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          kubectl -n "$NAMESPACE" patch ps-backup.ps.percona.com --all --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          kubectl -n "$NAMESPACE" patch ps-restore.ps.percona.com --all --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          kubectl -n "$NAMESPACE" patch restore --all --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          kubectl -n "$NAMESPACE" patch backup --all --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          kubectl -n "$NAMESPACE" patch instance --all --type=merge -p '{"metadata":{"finalizers":[]}}' || true
  steps:
    - name: setup-backup-infra
      try:
        - script:
            content: |
              kubectl -n provider-system scale deployment/provider-percona-server-mysql-ps-operator --replicas=0
              kubectl -n provider-system wait --for=jsonpath='{.spec.replicas}'=0 deployment/provider-percona-server-mysql-ps-operator --timeout=60s
              # Operator-created webhook has no endpoints once scaled to 0.
              kubectl get validatingwebhookconfiguration -o name 2>/dev/null | while read -r name; do
                case "$name" in
                  *percona-server-mysql*|*ps-operator*) kubectl delete "$name" --ignore-not-found ;;
                esac
              done
        - apply:
            file: 00-install.yaml
        - assert:
            file: 00-assert.yaml

    - name: create-source-cluster
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    - name: source-cluster-ready
      try:
        - apply:
            file: 11-cluster-ready.yaml
        - script:
            content: |
              kubectl patch ps.ps.percona.com/src-ps-cluster --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"src-ps-cluster-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":3,\"ready\":3,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 11-assert.yaml

    - name: create-backup
      try:
        - apply:
            file: 20-create-backup.yaml
        - assert:
            file: 20-assert.yaml

    - name: backup-ready
      try:
        - script:
            content: |
              kubectl patch ps-backup.ps.percona.com/src-backup --subresource status -n "$NAMESPACE" --type=merge \
                -p '{"status":{"state":"Succeeded"}}'
        - assert:
            file: 21-assert.yaml

    - name: create-restore
      try:
        - apply:
            file: 30-create-cluster-from-backup.yaml
        - assert:
            file: 30-assert.yaml

    - name: restore-complete
      try:
        - script:
            content: |
              kubectl patch ps-restore.ps.percona.com/src-restore --subresource status -n "$NAMESPACE" --type=merge \
                -p '{"status":{"state":"Succeeded"}}'
        - assert:
            file: 31-assert.yaml

    - name: delete-clusters
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete ps-restore.ps.percona.com,ps-backup.ps.percona.com,ps.ps.percona.com,backup,restore,instance --all --wait=false --ignore-not-found=true
              for kind in ps-backup.ps.percona.com ps-restore.ps.percona.com restore backup ps.ps.percona.com instance; do
                kubectl -n "$NAMESPACE" get "$kind" -o name 2>/dev/null | while read obj; do
                  kubectl -n "$NAMESPACE" patch "$obj" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
                done
              done
        - wait:
            apiVersion: backup.openeverest.io/v1alpha1
            kind: Restore
            for:
              deletion: {}
        - wait:
            apiVersion: ps.percona.com/v1
            kind: PerconaServerMySQLRestore
            for:
              deletion: {}
        - wait:
            apiVersion: ps.percona.com/v1
            kind: PerconaServerMySQLBackup
            for:
              deletion: {}
        - wait:
            apiVersion: ps.percona.com/v1
            kind: PerconaServerMySQL
            for:
              deletion: {}
        - wait:
            apiVersion: backup.openeverest.io/v1alpha1
            kind: Backup
            for:
              deletion: {}
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            for:
              deletion: {}

    - name: cleanup-backup-infra
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete backupstorage --all --ignore-not-found=true
              kubectl -n $NAMESPACE delete secret/backup-storage-credentials --ignore-not-found=true
        - wait:
            apiVersion: backup.openeverest.io/v1alpha1
            kind: BackupStorage
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: backup-storage-credentials
            for:
              deletion: {}

