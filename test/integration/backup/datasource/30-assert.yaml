apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: src-restore
spec:
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  instanceRef:
    name: src-ps-cluster
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQLRestore
metadata:
  name: src-restore
spec:
  clusterName: src-ps-cluster
  backupName: src-backup

