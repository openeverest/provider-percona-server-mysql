apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-tls
status:
  phase: Ready
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: test-ps-tls
status:
  state: ready
---
# The connection secret must carry the CA from the certificate secret
# (internal/provider/tls.go's tlsConnectionCA / provider.go's
# connectionDetails), so TLS clients can verify the instance's certificate.
apiVersion: v1
kind: Secret
metadata:
  name: test-ps-tls-conn
data:
  ca.crt: ZmFrZS1jYS1jcnQ=

