apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-tls-bothset
spec:
  providerRef:
    name: percona-server-mysql
  topology:
    type: groupreplication
  components:
    engine:
      type: mysql
      replicas: 3
      storage:
        size: 25Gi
  parameters:
    tls:
      # Setting a certificate secret and a cert-manager issuer together must
      # be rejected (validateTLS in internal/provider/tls.go). The secret
      # itself is valid and already exists (created in 10-create-secret.yaml)
      # so this exercises the "both set" rule specifically.
      certificateSecretName: test-ps-tls-certs
      issuer:
        name: some-issuer
        kind: Issuer

