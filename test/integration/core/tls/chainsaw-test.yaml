---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-tls
spec:
  description: |
    TLS certificate configuration (spec.parameters.tls): a user-supplied
    certificate secret is wired onto PerconaServerMySQL.spec.sslSecretName,
    its CA is exposed on the connection secret, a change of the certificate
    source on an existing instance and a secret and an issuer set together
    are rejected at admission, and an incomplete secret keeps the operator
    CR from ever being created.
    The Percona operator is scaled to 0 so status is simulated, matching
    other integration suites.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,ps.ps.percona.com -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mysql
        tail: 100
  steps:
    - name: scale-down-ps-operator
      try:
        - script:
            content: |
              kubectl -n provider-system scale deployment/provider-percona-server-mysql-ps-operator --replicas=0
              kubectl -n provider-system wait --for=jsonpath='{.spec.replicas}'=0 deployment/provider-percona-server-mysql-ps-operator --timeout=60s
              # Operator-created webhook has no endpoints once scaled to 0.
              kubectl get validatingwebhookconfiguration -o name 2>/dev/null | while read -r name; do
                case "$name" in
                  # The provider's own Instance webhook.
                  *.openeverest.io) ;;
                  *percona-server-mysql*|*ps-operator*) kubectl delete "$name" --ignore-not-found ;;
                esac
              done
        - assert:
            file: 00-assert.yaml

    - name: create-cluster-with-certificate-secret
      try:
        - apply:
            file: 10-create-secret.yaml
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    # Create the users secret, then simulate the cluster becoming ready. The
    # secret must exist before the status patch triggers reconcile, otherwise
    # connection details fail and the Instance cannot become Ready.
    - name: cluster-ready
      try:
        - apply:
            file: 11-cluster-ready.yaml
        - script:
            content: |
              kubectl patch ps.ps.percona.com/test-ps-tls --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"test-ps-tls-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":3,\"ready\":3,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 11-assert.yaml

    - name: certificate-secret-is-immutable
      try:
        - apply:
            file: 20-create-another-secret.yaml
        - script:
            content: |
              kubectl patch instance/test-ps-tls -n "$NAMESPACE" --type=merge \
                -p '{"spec":{"parameters":{"tls":{"certificateSecretName":"test-ps-tls-certs-2"}}}}'
            check:
              ($error != null): true
              (contains($stderr, 'spec.parameters.tls.certificateSecretName')): true
        - assert:
            file: 20-assert.yaml

    - name: incomplete-certificate-secret-is-rejected
      try:
        - apply:
            file: 30-create-cluster-incomplete-secret.yaml
        - assert:
            file: 30-assert.yaml
        - script:
            content: |
              # Validation must fail before Sync ever creates the operator CR.
              if kubectl get ps.ps.percona.com/test-ps-tls-badsecret -n "$NAMESPACE" 2>/dev/null; then
                echo "unexpected: PerconaServerMySQL test-ps-tls-badsecret was created despite an incomplete certificate secret" >&2
                exit 1
              fi
        - script:
            content: |
              kubectl -n "$NAMESPACE" delete instance/test-ps-tls-badsecret --ignore-not-found --wait=true

    - name: certificate-secret-and-issuer-together-is-rejected
      try:
        - script:
            content: kubectl apply -n $NAMESPACE -f 31-create-cluster-secret-and-issuer.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.parameters.tls.issuer')): true
        - error:
            file: 31-error.yaml

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete instance/test-ps-tls ps.ps.percona.com/test-ps-tls --wait=false --ignore-not-found && sleep 5
              kubectl -n $NAMESPACE patch ps.ps.percona.com/test-ps-tls -p '{"metadata":{"finalizers":null}}' --type merge || true
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-ps-tls
            for:
              deletion: {}
        - wait:
            apiVersion: ps.percona.com/v1
            kind: PerconaServerMySQL
            name: test-ps-tls
            for:
              deletion: {}

