---
# Missing ca.crt: validateCertificateSecret in internal/provider/tls.go must
# reject this before Sync ever creates a PerconaServerMySQL CR.
apiVersion: v1
kind: Secret
metadata:
  name: test-ps-tls-incomplete-certs
stringData:
  tls.crt: fake-tls-crt
  tls.key: fake-tls-key
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-tls-badsecret
spec:
  providerRef:
    name: percona-server-mysql
  topology:
    type: groupreplication
  components:
    engine:
      type: mysql
      replicas: 3
      storage:
        size: 25Gi
  parameters:
    tls:
      certificateSecretName: test-ps-tls-incomplete-certs

