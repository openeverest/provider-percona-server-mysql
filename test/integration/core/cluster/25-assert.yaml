apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-cluster
spec:
  providerRef:
    name: percona-server-mysql
  components:
    engine:
      type: mysql
      replicas: 5
      parameters:
        configuration: |
          max_connections: "500"
          innodb_buffer_pool_size: 1G
          innodb_flush_log_at_trx_commit: 2
    proxy:
      type: haproxy
      replicas: 1
status:
  phase: Ready
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: test-ps-cluster
spec:
  mysql:
    size: 5
    configuration: |
      innodb_buffer_pool_size="1G"
      innodb_flush_log_at_trx_commit=2
      max_connections="500"
status:
  state: ready
  mysql:
    size: 5
    ready: 5

