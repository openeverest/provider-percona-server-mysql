apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-cluster
spec:
  providerRef:
    name: percona-server-mysql
  components:
    engine:
      type: mysql
      replicas: 5
    proxy:
      type: haproxy
      replicas: 1
      service:
        serviceType: LoadBalancer
        annotations:
          test-annotation: "test-value"
        loadBalancerService:
          sourceRanges:
            - "10.0.0.0/8"
            - "192.168.1.100"
status:
  phase: Ready
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: test-ps-cluster
spec:
  mysql:
    size: 5
  proxy:
    haproxy:
      expose:
        type: LoadBalancer
        annotations:
          test-annotation: "test-value"
        loadBalancerSourceRanges:
          - "10.0.0.0/8"
          - "192.168.1.100/32"
status:
  state: ready
  mysql:
    size: 5
    ready: 5

