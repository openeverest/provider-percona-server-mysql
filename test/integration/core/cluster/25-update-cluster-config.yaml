apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-cluster
spec:
  providerRef:
    name: percona-server-mysql
  topology:
    type: groupreplication
  components:
    engine:
      type: mysql
      replicas: 5
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
      parameters:
        configuration: |
          max_connections: "500"
          innodb_buffer_pool_size: 1G
          innodb_flush_log_at_trx_commit: 2
    proxy:
      type: haproxy
      replicas: 1

