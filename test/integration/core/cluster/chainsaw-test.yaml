---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-cluster
spec:
  description: |
    Percona Server for MySQL Instance lifecycle: create a 3-node group-replication
    cluster, report Ready from simulated operator status, scale, apply affinity
    and Service type updates, switch to a single-node topology, and delete cleanly.
    The Percona operator is scaled to 0 so status is simulated, matching other
    integration suites.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,ps.ps.percona.com -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mysql
        tail: 100
  steps:
    - name: scale-down-ps-operator
      try:
        - script:
            content: |
              kubectl -n provider-system scale deployment/provider-percona-server-mysql-ps-operator --replicas=0
              kubectl -n provider-system wait --for=jsonpath='{.spec.replicas}'=0 deployment/provider-percona-server-mysql-ps-operator --timeout=60s
              # Operator-created webhook has no endpoints once scaled to 0.
              kubectl get validatingwebhookconfiguration -o name 2>/dev/null | while read -r name; do
                case "$name" in
                  *percona-server-mysql*|*ps-operator*) kubectl delete "$name" --ignore-not-found ;;
                esac
              done
        - assert:
            file: 00-assert.yaml

    - name: create-cluster
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    # Create the users secret, then simulate the cluster becoming ready. The
    # secret must exist before the status patch triggers reconcile, otherwise
    # connection details fail and the Instance cannot become Ready.
    - name: cluster-ready
      try:
        - apply:
            file: 11-cluster-ready.yaml
        - script:
            content: |
              kubectl patch ps.ps.percona.com/test-ps-cluster --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"test-ps-cluster-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":3,\"ready\":3,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 11-assert.yaml

    - name: scale-cluster
      try:
        - apply:
            file: 20-update-cluster.yaml
        - script:
            content: |
              kubectl wait ps.ps.percona.com/test-ps-cluster -n "$NAMESPACE" \
                --for=jsonpath='{.spec.mysql.size}'=5 --timeout=30s
              kubectl patch ps.ps.percona.com/test-ps-cluster --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"test-ps-cluster-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":5,\"ready\":5,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 20-assert.yaml

    - name: update-affinity
      try:
        - apply:
            file: 21-update-cluster-affinity.yaml
        - script:
            content: |
              kubectl wait ps.ps.percona.com/test-ps-cluster -n "$NAMESPACE" \
                --for=jsonpath='{.spec.mysql.affinity.advanced.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight}'=100 --timeout=30s
              kubectl patch ps.ps.percona.com/test-ps-cluster --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"test-ps-cluster-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":5,\"ready\":5,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 21-assert.yaml

    - name: update-service-load-balancer
      try:
        - apply:
            file: 22-update-cluster-lb.yaml
        - script:
            content: |
              kubectl wait ps.ps.percona.com/test-ps-cluster -n "$NAMESPACE" \
                --for=jsonpath='{.spec.proxy.haproxy.expose.type}'=LoadBalancer --timeout=30s
              kubectl patch ps.ps.percona.com/test-ps-cluster --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"test-ps-cluster-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":5,\"ready\":5,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 22-assert.yaml

    - name: update-service-cluster-ip
      try:
        - apply:
            file: 23-update-cluster-cluster-ip.yaml
        - script:
            content: |
              kubectl wait ps.ps.percona.com/test-ps-cluster -n "$NAMESPACE" \
                --for=jsonpath='{.spec.proxy.haproxy.expose.type}'=ClusterIP --timeout=30s
              kubectl patch ps.ps.percona.com/test-ps-cluster --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"test-ps-cluster-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":5,\"ready\":5,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 23-assert.yaml

    - name: update-service-node-port
      try:
        - apply:
            file: 24-update-cluster-node-port.yaml
        - script:
            content: |
              kubectl wait ps.ps.percona.com/test-ps-cluster -n "$NAMESPACE" \
                --for=jsonpath='{.spec.proxy.haproxy.expose.type}'=NodePort --timeout=30s
              kubectl patch ps.ps.percona.com/test-ps-cluster --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"test-ps-cluster-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":5,\"ready\":5,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 24-assert.yaml

    - name: create-single-node-cluster
      try:
        - apply:
            file: 40-create-single-node-cluster.yaml
        - assert:
            file: 40-assert.yaml

    - name: single-node-ready
      try:
        - apply:
            file: 41-cluster-ready.yaml
        - script:
            content: |
              kubectl wait ps.ps.percona.com/test-ps-cluster -n "$NAMESPACE" \
                --for=jsonpath='{.spec.mysql.size}'=1 --timeout=30s
              kubectl patch ps.ps.percona.com/test-ps-cluster --subresource status -n "$NAMESPACE" --type=merge \
                -p "{\"status\":{\"state\":\"ready\",\"host\":\"test-ps-cluster-haproxy.${NAMESPACE}.svc.cluster.local\",\"mysql\":{\"size\":1,\"ready\":1,\"state\":\"ready\"},\"haproxy\":{\"size\":1,\"ready\":1,\"state\":\"ready\"}}}"
        - assert:
            file: 41-assert.yaml

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete instance/test-ps-cluster ps.ps.percona.com/test-ps-cluster --wait=false --ignore-not-found && sleep 5
              kubectl -n $NAMESPACE patch ps.ps.percona.com/test-ps-cluster -p '{"metadata":{"finalizers":null}}' --type merge || true
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-ps-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: ps.percona.com/v1
            kind: PerconaServerMySQL
            name: test-ps-cluster
            for:
              deletion: {}

