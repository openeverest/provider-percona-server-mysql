apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-cluster
spec:
  providerRef:
    name: percona-server-mysql
  components:
    engine:
      type: mysql
      replicas: 1
    proxy:
      type: haproxy
      replicas: 1
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: test-ps-cluster
spec:
  mysql:
    size: 1
  proxy:
    haproxy:
      enabled: true
      size: 1
  unsafeFlags:
    mysqlSize: true

