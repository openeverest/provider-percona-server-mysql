apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-cluster
spec:
  providerRef:
    name: percona-server-mysql
  topology:
    type: groupreplication
  components:
    engine:
      type: mysql
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
    proxy:
      type: haproxy
      replicas: 1
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: test-ps-cluster
spec:
  mysql:
    clusterType: group-replication
    size: 3
    resources:
      limits:
        cpu: "1"
        memory: 4G
      requests:
        cpu: 500m
        memory: 2G
    volumeSpec:
      persistentVolumeClaim:
        storageClassName: standard
        resources:
          requests:
            storage: 25Gi
  proxy:
    haproxy:
      enabled: true
      size: 1

