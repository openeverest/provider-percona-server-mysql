apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-ps-admission
spec:
  providerRef:
    name: percona-server-mysql
  topology:
    type: async
  components:
    engine:
      type: mysql
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 600m
          memory: 2G
      storage:
        size: 25Gi
    orchestrator:
      type: orchestrator
      replicas: 0
    proxy:
      type: haproxy
      replicas: 1
