apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: ps-mon
spec:
  providerRef:
    name: percona-server-mysql
  topology:
    type: async
  components:
    engine:
      type: mysql
      replicas: 1
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 600m
          memory: 1Gi
        requests:
          cpu: 600m
          memory: 1Gi
    proxy:
      type: haproxy
      replicas: 1
    monitoring:

