---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-tls
spec:
  description: |
    TLS against a real PS operator: generate a self-signed CA/certificate,
    create an Instance with spec.parameters.tls.certificateSecretName
    pointing at it, and verify end to end that the operator leaves the
    secret alone, the connection secret carries the CA, the client
    connection actually negotiates TLS, and the server presents the
    certificate we supplied (not an operator-generated one).
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,ps.ps.percona.com -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mysql
        tail: 100
  steps:
    - name: provider-operator-installed
      try:
        - assert:
            file: 00-assert.yaml

    - name: generate-certificate-and-secret
      try:
        - script:
            content: |
              set -e
              WORKDIR="/tmp/ps-tls-e2e-${NAMESPACE}"
              rm -rf "${WORKDIR}" && mkdir -p "${WORKDIR}"
              cd "${WORKDIR}"

              openssl genrsa -out ca.key 2048 2>/dev/null
              openssl req -x509 -new -nodes -key ca.key -sha256 -days 1 \
                -subj "/CN=ps-tls-ca" -out ca.crt

              openssl genrsa -out tls.key 2048 2>/dev/null
              openssl req -new -key tls.key -subj "/CN=ps-tls-mysql" -out server.csr

              cat > san.cnf <<SANEOF
              subjectAltName = @alt_names
              [alt_names]
              DNS.1  = *.ps-tls-mysql
              DNS.2  = *.ps-tls-mysql.${NAMESPACE}
              DNS.3  = *.ps-tls-mysql.${NAMESPACE}.svc
              DNS.4  = *.ps-tls-orchestrator
              DNS.5  = *.ps-tls-orchestrator.${NAMESPACE}
              DNS.6  = *.ps-tls-orchestrator.${NAMESPACE}.svc
              DNS.7  = *.ps-tls-router
              DNS.8  = *.ps-tls-router.${NAMESPACE}
              DNS.9  = *.ps-tls-router.${NAMESPACE}.svc
              DNS.10 = ps-tls-mysql-primary
              DNS.11 = ps-tls-mysql-primary.${NAMESPACE}
              DNS.12 = ps-tls-mysql-primary.${NAMESPACE}.svc
              DNS.13 = *.ps-tls-haproxy
              DNS.14 = *.ps-tls-haproxy.${NAMESPACE}
              DNS.15 = *.ps-tls-haproxy.${NAMESPACE}.svc
              SANEOF

              openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
                -out tls.crt -days 1 -sha256 -extfile san.cnf

              kubectl create secret generic ps-tls-certs -n "${NAMESPACE}" \
                --from-file=tls.crt=tls.crt --from-file=tls.key=tls.key --from-file=ca.crt=ca.crt

    - name: create-cluster
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    - name: cluster-ready
      try:
        - assert:
            timeout: 15m
            file: 20-assert.yaml
      catch:
        - script:
            content: |
              kubectl -n "${NAMESPACE}" get pods,pvc,ps.ps.percona.com,instance -o wide
              kubectl -n "${NAMESPACE}" describe pod -l app.kubernetes.io/component=database || true

    - name: certificate-secret-is-untouched
      try:
        - script:
            content: |
              set -e
              WORKDIR="/tmp/ps-tls-e2e-${NAMESPACE}"
              owners="$(kubectl get secret/ps-tls-certs -n "${NAMESPACE}" -o jsonpath='{.metadata.ownerReferences}')"
              if [ -n "$owners" ]; then
                echo "unexpected: the operator took ownership of the user-supplied certificate secret: $owners" >&2
                exit 1
              fi
              kubectl get secret/ps-tls-certs -n "${NAMESPACE}" -o jsonpath='{.data.tls\.crt}' | base64 -d > "${WORKDIR}/tls.crt.actual"
              diff "${WORKDIR}/tls.crt.actual" "${WORKDIR}/tls.crt"
              echo "certificate secret unchanged"

    - name: connection-secret-carries-ca
      try:
        - script:
            content: |
              set -e
              WORKDIR="/tmp/ps-tls-e2e-${NAMESPACE}"
              kubectl get secret/ps-tls-conn -n "${NAMESPACE}" -o jsonpath='{.data.ca\.crt}' | base64 -d > "${WORKDIR}/ca.crt.actual"
              diff "${WORKDIR}/ca.crt.actual" "${WORKDIR}/ca.crt"
              echo "connection secret carries our CA"

    - name: create-mysql-client
      try:
        - script:
            timeout: 180s
            content: |
              IMAGE="$(kubectl get ps.ps.percona.com/ps-tls -n "${NAMESPACE}" -o jsonpath='{.spec.mysql.image}')"
              NODE="$(kubectl get pod -n "${NAMESPACE}" -l app.kubernetes.io/instance=ps-tls,app.kubernetes.io/component=database -o jsonpath='{.items[0].spec.nodeName}')"
              kubectl run -n "${NAMESPACE}" mysql-tls-client --env="NO_COLOR=1" --image="${IMAGE}" --image-pull-policy=IfNotPresent --restart=Never --overrides="{\"spec\":{\"nodeName\":\"${NODE}\"}}" --command -- sleep 3600
              kubectl wait --for=condition=Ready pod/mysql-tls-client --timeout=150s -n "${NAMESPACE}"

    - name: verify-client-connection-uses-tls
      try:
        - script:
            timeout: 60s
            content: |
              set -e
              HOST="$(kubectl get secret/ps-tls-conn -n ${NAMESPACE} -o jsonpath='{.data.host}' | base64 -d)"
              USER="$(kubectl get secret/ps-tls-conn -n ${NAMESPACE} -o jsonpath='{.data.username}' | base64 -d)"
              PASS="$(kubectl get secret/ps-tls-conn -n ${NAMESPACE} -o jsonpath='{.data.password}' | base64 -d)"
              CIPHER="$(kubectl exec mysql-tls-client -n ${NAMESPACE} -- \
                mysql -h "$HOST" -P 3306 -u "$USER" -p"$PASS" --ssl-mode=REQUIRED --get-server-public-key -N -s \
                -e "SHOW STATUS LIKE 'Ssl_cipher';" | awk '{print $2}')"
              echo "Ssl_cipher=${CIPHER}"
              test -n "${CIPHER}"

    - name: verify-server-presents-our-certificate
      try:
        - script:
            timeout: 60s
            content: |
              set -e
              WORKDIR="/tmp/ps-tls-e2e-${NAMESPACE}"
              HOST="$(kubectl get secret/ps-tls-conn -n ${NAMESPACE} -o jsonpath='{.data.host}' | base64 -d)"
              if ! kubectl exec mysql-tls-client -n ${NAMESPACE} -- sh -c 'command -v openssl' >/dev/null 2>&1; then
                echo "openssl not available in the engine image; skipping certificate-subject check"
                exit 0
              fi
              SUBJECT="$(kubectl exec mysql-tls-client -n ${NAMESPACE} -- sh -c \
                "echo | openssl s_client -starttls mysql -connect ${HOST}:3306 2>/dev/null | openssl x509 -noout -subject -issuer" || true)"
              echo "${SUBJECT}"
              echo "${SUBJECT}" | grep -q "CN *= *ps-tls-mysql" 
              echo "${SUBJECT}" | grep -q "CN *= *ps-tls-ca"

    - name: cleanup
      try:
        - script:
            timeout: 180s
            content: |
              kubectl delete pod/mysql-tls-client -n $NAMESPACE --ignore-not-found --wait=false || true
              kubectl delete instance/ps-tls -n $NAMESPACE --ignore-not-found --wait=true --timeout=150s || true
              rm -rf "/tmp/ps-tls-e2e-${NAMESPACE}" || true


