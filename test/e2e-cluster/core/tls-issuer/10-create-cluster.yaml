# Async + HAProxy + one orchestrator: without the orchestrator component the
# PS operator's CEL rules reject the CR (spec.orchestrator is omitted).
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: ps-issuer
spec:
  providerRef:
    name: percona-server-mysql
  topology:
    type: async
  components:
    engine:
      type: mysql
      replicas: 1
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 600m
          memory: 1Gi
        requests:
          cpu: 600m
          memory: 1Gi
    proxy:
      type: haproxy
      replicas: 1
    orchestrator:
      type: orchestrator
      replicas: 1
  parameters:
    tls:
      mode: requireTLS
      issuer:
        name: company-ca
        group: cert-manager.io
      additionalNames:
        - db.example.com
