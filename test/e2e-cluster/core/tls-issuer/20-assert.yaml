apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: ps-issuer
status:
  state: ready
  mysql:
    ready: 1
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: ps-issuer
status:
  (conditions[?type == 'Ready'].status | [0]): "True"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ps-issuer-ssl
spec:
  issuerRef:
    name: company-ca
  (contains(dnsNames, 'db.example.com')): true
