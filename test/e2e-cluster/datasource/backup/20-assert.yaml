apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: ps
spec:
  displayName: Percona Backup for Percona Server for MySQL Operator
  executionMode: ProviderManaged
  supportedProviders:
    - percona-server-mysql
  providerManaged:
    supportsPITR: false
---
apiVersion: v1
kind: Secret
metadata:
  name: mc-pmm-secret
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringConfig
metadata:
  name: mc-pmm
spec:
  type: pmm
  pmm:
    credentialsSecretRef:
      name: mc-pmm-secret
    url: https://pmm-server.pmm.svc
