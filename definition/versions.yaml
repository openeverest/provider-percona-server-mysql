# Component type version catalog.
# Add new versions here when operator releases are available.
# Name the default version per type via `defaultVersion`.

defaultVersion: 8.4.10-10.1
versions:
    - components:
        engine: 8.0.40-31
        backup: 8.4.0-6.1
      name: 8.0.40-31
    - components:
        engine: 8.0.42-33
        backup: 8.4.0-6.1
      name: 8.0.42-33
    - components:
        engine: 8.0.43-34.1
        backup: 8.4.0-6.1
      name: 8.0.43-34.1
    - components:
        engine: 8.0.45-36.1
        backup: 8.4.0-6.1
      name: 8.0.45-36.1
    - components:
        engine: 8.0.46-37.1
        backup: 8.4.0-6.1
      name: 8.0.46-37.1
    - components:
        engine: 8.4.5-5
        backup: 8.4.0-6.1
      name: 8.4.5-5
    - components:
        engine: 8.4.6-6.1
        backup: 8.4.0-6.1
      name: 8.4.6-6.1
    - components:
        engine: 8.4.8-8.1
        backup: 8.4.0-6.1
      name: 8.4.8-8.1
    - components:
        engine: 8.4.10-10.1
        backup: 8.4.0-6.1
      name: 8.4.10-10.1

componentTypes:
    mysql:
        defaultVersion: 8.4.10-10.1
        versions:
            - image: percona/percona-server:8.0.40-31
              version: 8.0.40-31
            - image: percona/percona-server:8.0.42-33
              version: 8.0.42-33
            - image: percona/percona-server:8.0.43-34.1
              version: 8.0.43-34.1
            - image: percona/percona-server:8.0.45-36.1
              version: 8.0.45-36.1
            - image: percona/percona-server:8.0.46-37.1
              version: 8.0.46-37.1
            - image: percona/percona-server:8.4.5-5
              version: 8.4.5-5
            - image: percona/percona-server:8.4.6-6.1
              version: 8.4.6-6.1
            - image: percona/percona-server:8.4.8-8.1
              version: 8.4.8-8.1
            - image: percona/percona-server:8.4.10-10.1
              version: 8.4.10-10.1
    orchestrator:
        defaultVersion: 3.2.6-22
        versions:
            - image: percona/percona-orchestrator:3.2.6-22
              version: 3.2.6-22
    haproxy:
        defaultVersion: 2.8.18-1
        versions:
            - image: percona/haproxy:2.8.18-1
              version: 2.8.18-1
    # toolkit is not user-facing (no component in definition/provider.yaml
    # references it): the operator requires spec.toolkit.image for the
    # pt-heartbeat sidecar whenever async + orchestrator are both active, so
    # the provider always resolves the default version below in that case.
    toolkit:
        defaultVersion: 3.7.0
        versions:
            - image: percona/percona-toolkit:3.7.0
              version: 3.7.0
    router:
        defaultVersion: 8.4.10-10.1
        versions:
            - image: percona/percona-mysql-router:8.0.46-37.1
              version: 8.0.46-37.1
            - image: percona/percona-mysql-router:8.4.10-10.1
              version: 8.4.10-10.1
    # backup is not a user-facing component (no component in
    # definition/provider.yaml references it): it resolves the xtrabackup
    # image used by PerconaServerMySQLBackup/-Restore resources, mirroring
    # how the operator's own deploy/cr.yaml pins a single xtrabackup image
    # regardless of the selected MySQL engine version.
    backup:
        defaultVersion: 8.4.0-6.1
        versions:
            - image: percona/percona-xtrabackup:8.4.0-6.1
              version: 8.4.0-6.1
