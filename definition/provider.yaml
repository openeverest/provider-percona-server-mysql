# Provider identity and component definitions.
# Edit this file to add or remove components.
# Run `make generate` after making changes.

# Instance-wide parameters (Instance.spec.parameters), a Go type in
# definition/types.go.
parametersSchema: Parameters

components:
    engine:
        type: mysql
        parametersSchema: MysqlParameters
    orchestrator:
        type: orchestrator
    proxy:
        type: haproxy
        parametersSchema: ProxyParameters
    # backup is not a structural component (it never appears in any
    # topology's config.components and users never set
    # spec.components.backup): it exists solely so version bundles can pin
    # the xtrabackup image used by PerconaServerMySQLBackup/-Restore
    # resources. See internal/provider/backup_mirror.go's
    # resolveBackupImage and definition/versions.yaml's componentTypes.backup.
    backup:
        type: backup
name: percona-server-mysql

# Component types: the kind of the software each type runs, published as
# Provider.spec.componentTypes.<type>.kind and matched by monitoring classes.
# Router is not listed: it has no Prometheus endpoint to expose.
componentTypes:
    mysql:
        kind: mysql
    haproxy:
        kind: haproxy

